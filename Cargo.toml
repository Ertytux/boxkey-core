[package]
name = "boxkey-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Biblioteca criptográfica central del protocolo BoxKey (BZ). DKG, FROST (RFC 9591), Schnorr BIP340, resharing."
license = "MIT"
repository = "https://github.com/Ertytux/boxkey-core"

[lib]
name = "boxkey_core"
path = "src/lib.rs"

[dependencies]
k256 = { version = "0.13", features = ["schnorr"] }
frost-secp256k1-tr = { version = "3.0", features = ["serialization"] }
frost-core = { version = "3.0", features = ["serialization"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zeroize = { version = "1.6", features = ["zeroize_derive"] }
hex = "0.4"
chacha20poly1305 = "0.10"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "signing_bench"
harness = false

[[bench]]
name = "dkg_bench"
harness = false